name: Stylesheet

# `public/tailwind.css` is generated by `npm run build:css` and committed, so the
# dashboard can be served with no build step. That makes it easy to forget to
# rebuild after adding a Tailwind class, which would ship a page with missing
# styles. This job rebuilds it and fails if the committed file differs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild the Tailwind stylesheet
        run: npm run build:css
      - name: Fail if the committed stylesheet is stale
        run: |
          if ! git diff --quiet -- public/tailwind.css; then
            echo "public/tailwind.css is out of date. Run 'npm run build:css' and commit the result." >&2
            git --no-pager diff --stat -- public/tailwind.css >&2
            exit 1
          fi
          echo "public/tailwind.css is up to date."
